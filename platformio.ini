; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = ESP32-Hardware
description = Librairy for esp32
; Leave default_envs empty so it will build all env
default_envs = 
; build_dir = ${PROJECT_DIR}/.pio/build
build_dir = C:/.pio/PAMI_Firmware/ESP32_Hardware/build
libdeps_dir = C:/.pio/PAMI_Firmware/ESP32_Hardware/libdeps

[env]
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32@^7.1.3
board = ESP32-S3-Tiny
framework = arduino
upload_protocol = esptool
build_type = debug
board_build.partitions = partitions_usb_no_ota.csv
build_src_filter = 
	+<*>
	+<../${PIOENV}/${PIOENV}.cpp>
upload_speed = 921600
monitor_speed = 921600
monitor_filters = 
	colorize
	time
	send_on_enter
	esp32_exception_decoder
monitor_echo = yes
monitor_eol = LF
lib_deps = 
	Esp32_Helper=symlink://../Esp32_Helper
	Dynamixel2Arduino=symlink://../Dynamixel2Arduino
	greiman/SSD1306Ascii@^1.3.5
	adafruit/Adafruit INA219@^1.2.3
; on utilise la version 3.9.16 de FastLED car la 3.9.17 est bugguée: error: 'LookaheadMode' has not been declared
	fastled/FastLED@3.9.16
	stm32duino/STM32duino VL53L8CX @ ^2.0.3
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=c++17
	-std=gnu++17
	-I config
	-D ARDUINO_ESP32S3_DEV
	-D ARDUINO_USB_MODE=1

[env:main]
build_unflags = 
	${env.build_unflags}
build_flags = 
	${env.build_flags}
	-D SIMULATOR
	-D WOKWI
	-D ESP32_HARDWARE_LIB
extra_scripts = post:scripts/extra_script.py
